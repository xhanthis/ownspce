            - generic [ref=e214]: 6 min read
        - generic [ref=e215]:
          - paragraph [ref=e216]: I’ve used Notion since 2020. I’ve tried Obsidian, Logseq, Roam, Bear, Apple Notes, and at one point, a physical Moleskine. None of them felt right. Notion is powerful but cloud-locked — my product ideas sit on someone else’s AWS instances and I have no say in that.
          - paragraph [ref=e217]: Obsidian is private and local, but the mobile app is an afterthought, and there’s no task management. You need plugins for everything.
          - blockquote [ref=e218]:
            - paragraph [ref=e219]: "The gap I kept hitting: a beautiful, mobile-first app where the data is mine, that also does tasks. That combination doesn’t exist."
          - paragraph [ref=e220]: So I’m building it.
