        - heading "Stored in the cloud. Sealed before it leaves your device." [level=2] [ref=e147]
        - paragraph [ref=e148]: Your pages are on every device instantly — but they arrive already encrypted. Our servers store and relay opaque blobs. There is no key on our side, so there is nothing to read, leak, or hand over.
        - generic [ref=e149]:
          - generic [ref=e150]:
            - generic [ref=e151]: Sign-in identity
            - paragraph [ref=e152]: Google or Apple. Decides which sealed data you may fetch. Recoverable.
          - generic [ref=e153]:
            - generic [ref=e154]: Encryption identity
            - paragraph [ref=e155]: A key generated on your device. Decides what can be decrypted. Never uploaded.
        - list [ref=e156]:
          - listitem [ref=e157]:
