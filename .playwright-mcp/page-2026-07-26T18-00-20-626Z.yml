      - generic [ref=e198]:
        - paragraph [ref=e199]: I’ve used Notion since 2020. I’ve tried Obsidian, Logseq, Roam, Bear, Apple Notes, and at one point, a physical Moleskine. None of them felt right. Notion is powerful but cloud-locked — my product ideas sit on someone else’s AWS instances and I have no say in that.
        - paragraph [ref=e200]: Obsidian is private and local, but the mobile app is an afterthought, and there’s no task management. You need plugins for everything.
        - blockquote [ref=e201]:
          - paragraph [ref=e202]: "The gap I kept hitting: a beautiful, mobile-first app where the data is mine, that also does tasks. That combination doesn’t exist."
        - paragraph [ref=e203]: So I’m building it.
